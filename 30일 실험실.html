<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>30일 실험실</title>
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#2e3835;--mut:#7a837f;--ac:#587a6f;--ac2:#e3ebe5;--ln:#e2ddd0;--warm:#b98a5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2321;--card:#252d2a;--ink:#e6ebe8;--mut:#93a09a;--ac:#8fb5a8;--ac2:#2f3b37;--ln:#38433f;--warm:#d4a574;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c2321;--card:#252d2a;--ink:#e6ebe8;--mut:#93a09a;--ac:#8fb5a8;--ac2:#2f3b37;--ln:#38433f;--warm:#d4a574;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif}
#app{max-width:640px;margin:0 auto;padding:18px 16px 96px}
h1,h2,h3{font-family:"Noto Serif KR",Georgia,serif;font-weight:600;margin:.2em 0 .4em}h1{font-size:22px}h2{font-size:19px}h3{font-size:16px;margin-top:1.2em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:0 0 14px}
.mut{color:var(--mut);font-size:13px}.note{background:var(--ac2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.toast{background:var(--ac);color:#fff;border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:8px 0}
.stats div{background:var(--ac2);border-radius:10px;padding:10px;text-align:center}.stats b{display:block;font-size:19px}.stats span{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;flex-wrap:wrap}.row label{flex:1 1 180px}
.sc{display:flex;gap:6px}.sc button,.seg button{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:9px;min-width:40px;height:40px;font:inherit;cursor:pointer}
.sc button.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.seg{display:flex;gap:6px}.seg button{padding:0 14px}
input,textarea,select{width:100%;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:9px;padding:9px;font:inherit}textarea{min-height:64px;resize:vertical}input[type=number]{width:100px}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}button.gh{background:none;color:var(--ac);border:1px solid var(--ac);border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:5px 12px;margin:3px 4px 3px 0;font-size:13px;cursor:pointer;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.grid button{aspect-ratio:1;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}.grid .rec{background:var(--ac);color:#fff;border-color:var(--ac)}.grid button:disabled{opacity:.35}
.bar{height:8px;background:var(--ac2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:center}th:first-child,td:first-child{text-align:left}
ul{padding-left:18px;margin:.3em 0}li{margin:.35em 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 2px;font:inherit;font-size:13px;cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
.leg{font-size:12px;color:var(--mut)}
.q{margin:10px 0;padding:12px 14px;border-left:3px solid var(--ac);background:var(--ac2);border-radius:0 10px 10px 0;font-family:"Noto Serif KR",Georgia,serif;line-height:1.9}
.sg{background:var(--ac2);border-radius:12px;padding:12px;margin:10px 0}.sg p{margin:.4em 0}
.must{border:2px solid var(--ac)}.soft{border-style:dashed;background:transparent}
.ft{text-align:center;color:var(--mut);font-size:12px;margin:28px 0 8px}
</style></head><body><div id="app"></div>
<nav><button data-t="today" onclick="go('today')">오늘</button><button data-t="exp" onclick="go('exp')">실험</button><button data-t="log" onclick="go('log')">기록</button><button data-t="ana" onclick="go('ana')">분석</button><button data-t="hist" onclick="go('hist')">실험 기록</button></nav>
<script>
const K='lab30.v1',P2=n=>String(n).padStart(2,'0'),$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function td(d=new Date()){return d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate())}
const pd=s=>new Date(s+'T00:00:00'),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return td(d)},dif=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const num=v=>typeof v==='number'&&!isNaN(v),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=v=>v==null?'–':v.toFixed(1);
let S={phases:[],logs:{}},tab='today',editDate=td(),draft={},viewId=null,msg='',bk='',cf='';
try{const j=JSON.parse(localStorage.getItem(K));if(j&&Array.isArray(j.phases)&&j.logs)S=j}catch(e){}
draft={...(S.logs[editDate]||{})};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){msg='이 브라우저에서는 저장이 어려워요. 백업을 자주 해 주세요.'}}
const act=()=>S.phases.find(p=>p.status==='active'),P=id=>S.phases.find(p=>p.id===id);
const plogs=p=>Object.entries(S.logs).filter(([d,l])=>l.pid===p.id).map(([d,l])=>({...l,d,i:dif(d,p.start)})).sort((a,b)=>a.d<b.d?-1:1);
const pname=p=>p.type==='observe'?'나를 관찰하는 30일':'30일 실험 '+P2(p.n)+(p.title?' · '+p.title:'');
const BOOL=[['meal','식사를 규칙적으로 했어요'],['out','밖에 나갔어요'],['talk','사람과 대화했어요'],['move','몸을 움직였어요'],['focus','집중해서 무언가를 했어요'],['self','나를 위해 한 일이 있었어요']];
const SN={out:'외출',talk:'대화',move:'몸을 움직임',focus:'집중',self:'나를 위한 시간',meal:'규칙적인 식사'};
const LB={out:'외출한',talk:'사람과 대화한',move:'몸을 움직인',focus:'집중한 활동이 있던',self:'나를 위해 한 일이 있던',meal:'식사를 규칙적으로 한'};
const SUG={out:['하루 10분 밖에 나가기','하루 10분이라도 밖에 나가면 기분이 조금 나아질 수 있다.'],talk:['하루 한 번 사람과 짧게 대화하기','짧게라도 사람과 대화하면 기분이 나아질 수 있다.'],move:['하루 10분 몸 움직이기','잠깐이라도 몸을 움직이면 기분이나 에너지가 나아질 수 있다.'],focus:['하루 한 번 집중하는 시간 갖기','집중해서 무언가를 하는 시간이 있으면 기분이 나아질 수 있다.'],self:['하루 한 번 나를 위한 시간 갖기','나를 위한 시간을 가지면 기분이 나아질 수 있다.'],meal:['식사 시간을 일정하게 유지하기','규칙적으로 식사하면 에너지가 나아질 수 있다.']};
const SC=[['sleepQ','수면 만족도'],['mood','오늘의 기분'],['energy','오늘의 에너지']];
function cap(){document.querySelectorAll('[data-t]').forEach(e=>{draft[e.dataset.t]=e.dataset.n?(e.value===''?undefined:parseFloat(e.value)):e.value})}
function setS(k,n){cap();draft[k]=draft[k]===n?undefined:n;render()}
function setB(k,v){cap();draft[k]=draft[k]===v?undefined:v;render()}
function go(t){tab=t;viewId=null;cf='';render();scrollTo(0,0)}
function openDate(d){editDate=d;draft={...(S.logs[d]||{})};tab='today';render();scrollTo(0,0)}
function view(id){viewId=id;tab='hist';render();scrollTo(0,0)}
function ask(k){cf=k;render()}
/* ---------- 오늘 ---------- */
const sRow=k=>{const n=SC.find(x=>x[0]===k)[1];return `<div class="row"><label>${n}<div class="mut">1 낮음 · 3 보통 · 5 높음</div></label><div class="sc">${[1,2,3,4,5].map(v=>`<button class="${draft[k]===v?'on':''}" onclick="setS('${k}',${v})">${v}</button>`).join('')}</div></div>`};
function vToday(){const p=act();
 if(!p)return '<div class="card"><h2>오늘의 관찰</h2><p>아직 진행 중인 구간이 없어요. 「실험」 탭에서 시작할 수 있어요.</p></div>';
 const day=dif(editDate,p.start)+1,ex=p.type==='experiment'&&day>=1;
 let h=`<div class="card"><div class="mut">${esc(pname(p))}</div><h2>${editDate===td()?'오늘':editDate}의 기록</h2><p class="mut">${editDate} ${day>=1?'· '+day+'일째':'· 새 구간은 '+p.start+'부터 시작해요'}</p><p class="note">오늘 하루를 한번 관찰해볼까요? 적고 싶은 것만 적어도 괜찮아요. 기록하지 못한 날도, 아무것도 하지 않은 날도 괜찮아요. 모두 소중한 관찰이에요.</p></div><div class="card must"><h3>오늘 꼭 기록할 것</h3><p class="mut">힘든 날에는 이 둘만 기록하고 나가도 괜찮아요.</p>${sRow('mood')}${sRow('energy')}<button class="pri" onclick="saveDay()">이것만 저장하고 나가기</button></div><div class="card"><h3>오늘의 생활 관찰</h3><p class="mut">기억나는 것만 골라서 적어도 돼요.</p><div class="row"><label>수면 시간 (시간)</label><input type="number" step="0.5" min="0" max="24" data-t="sleepH" data-n="1" value="${num(draft.sleepH)?draft.sleepH:''}"></div>`;
 SC.forEach(([k,n],i)=>{if(k!=='sleepQ')return;h+=`<div class="row"><label>${n}<div class="mut">1 낮음 · 3 보통 · 5 높음</div></label><div class="sc">${[1,2,3,4,5].map(v=>`<button class="${draft[k]===v?'on':''}" onclick="setS('${k}',${v})">${v}</button>`).join('')}</div></div>`});
 h+='<hr style="border:0;border-top:1px solid var(--ln)">';
 const B=BOOL.slice();if(ex)B.push(['act','이번 실험의 행동을 했어요: '+p.change]);
 B.forEach(([k,n])=>h+=`<div class="row"><label>${esc(n)}</label><div class="seg"><button class="${draft[k]===true?'on':''}" onclick="setB('${k}',true)">예</button><button class="${draft[k]===false?'on':''}" onclick="setB('${k}',false)">아니요</button></div></div>`);
 h+=`</div><div class="card soft"><h3>더 기록하고 싶다면</h3><p class="mut">마음이 내킬 때만 적어요. 비워 두어도 괜찮아요.</p>${[['hard','오늘 가장 힘들었던 것'],['good','오늘 괜찮았던 것'],['memo','자유 메모']].map(([k,n])=>`<h3>${n}</h3><textarea data-t="${k}">${esc(draft[k]||'')}</textarea>`).join('')}</div><button class="pri" onclick="saveDay()">오늘의 기록 저장하기</button>`;
 return h}
function saveDay(){cap();const l={};for(const k in draft)if(draft[k]!==undefined&&draft[k]!==''&&k!=='pid')l[k]=draft[k];
 if(!Object.keys(l).length){msg='아직 적은 내용이 없어요. 기록하지 못한 날도 괜찮아요.';return render()}
 const p=act(),old=S.logs[editDate];
 l.pid=(old&&old.pid)||(p&&editDate>=p.start?p.id:([...S.phases].reverse().find(q=>q.start<=editDate)||p).id);
 S.logs[editDate]=l;save();if(!msg)msg='저장했어요. 오늘의 관찰이 하나 쌓였어요.';editDate=td();draft={...(S.logs[editDate]||{})};render();scrollTo(0,0)}
/* ---------- 분석 ---------- */
function chart(list,days){list=list.filter(l=>l.i>=0);const W=320,H=110,mx=Math.max(days,...list.map(l=>l.i+1)),x=i=>12+i*(W-24)/Math.max(mx-1,1),y=v=>H-10-(v-1)*(H-20)/4;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="일별 기록 그래프">`;
 for(let v=1;v<=5;v+=2)s+=`<line x1="12" x2="${W-12}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/>`;
 [['mood','var(--ac)'],['energy','var(--warm)'],['sleepQ','var(--mut)']].forEach(([k,c])=>{let d='',last=-9,pts='';list.forEach(l=>{if(!num(l[k]))return;d+=(l.i===last+1?'L':'M')+x(l.i).toFixed(1)+' '+y(l[k]).toFixed(1)+' ';last=l.i;pts+=`<circle cx="${x(l.i).toFixed(1)}" cy="${y(l[k]).toFixed(1)}" r="2.5" fill="${c}"/>`});s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8"/>${pts}`});
 return s+'</svg><div class="leg"><span style="color:var(--ac)">● 기분</span> &nbsp;<span style="color:var(--warm)">● 에너지</span> &nbsp;<span style="color:var(--mut)">● 수면 만족도</span> · 비어 있는 곳은 기록하지 않은 날이에요</div>'}
function insights(list){const F=[],G=[],U=[],SG=[],n=list.length,M=(k)=>list.filter(l=>num(l[k]));
 if(n<5)return {F,G,SG,nF:0,U:['기록이 아직 5일보다 적어서 패턴을 판단하기 어렵습니다. 조금 더 관찰해볼까요?']};
 const grp=(k,m)=>{const a=list.filter(l=>l[k]===true&&num(l[m])).map(l=>l[m]),b=list.filter(l=>l[k]===false&&num(l[m])).map(l=>l[m]);return a.length>=3&&b.length>=3?[avg(a),avg(b)]:null};
 const say=(arr,k,m,mn)=>{const r=grp(k,m);if(!r){U.push(`‘${SN[k]}’와(과) ${mn}의 관계는 기록이 부족해서 판단하기 어렵습니다.`);return}const d=r[0]-r[1];if(d>=0.3&&SUG[k])SG.push({o:'기록상 '+LB[k]+' 날의 평균 '+mn+' 점수가 상대적으로 높았습니다.',c:SUG[k][0],h:SUG[k][1],k:k,m:m});const v=`(${f1(r[0])} vs ${f1(r[1])})`;arr.push(Math.abs(d)<0.3?`${LB[k]} 날과 그렇지 않은 날의 평균 ${mn} 점수 차이는 크지 않았습니다 ${v}.`:`기록상 ${LB[k]} 날의 평균 ${mn} 점수가 그렇지 않은 날보다 ${d>0?'높았습니다':'낮았습니다'} ${v}.`)};
 ['out','talk','move','focus','self'].forEach(k=>say(F,k,'mood','기분'));const nF=F.length;
 ['meal','move'].forEach(k=>say(G,k,'energy','에너지'));
 const hi=list.filter(l=>l.sleepQ>=4&&num(l.energy)).map(l=>l.energy),lo=list.filter(l=>l.sleepQ<=3&&num(l.energy)).map(l=>l.energy);
 if(hi.length>=3&&lo.length>=3){const d=avg(hi)-avg(lo);if(d>=0.3)SG.push({o:'기록상 수면 만족도가 높은 날 에너지도 높은 경향이 있었습니다.',k:'sleep',m:'sleep',c:'취침 시간을 일정하게 유지해보기',h:'취침 시간이 일정하면 수면 만족도와 에너지가 나아질 수 있다.'});G.push(Math.abs(d)<0.3?'수면 만족도가 높았던 날과 낮았던 날의 에너지 점수 차이는 크지 않았습니다.':`수면 만족도가 높았던 날(4점 이상)에는 에너지 점수가 ${d>0?'높은':'낮은'} 경향이 있었습니다 (${f1(avg(hi))} vs ${f1(avg(lo))}).`)}else U.push('수면 만족도와 에너지의 관계는 기록이 부족해서 판단하기 어렵습니다.');
 const sh=list.filter(l=>num(l.sleepH)&&num(l.energy));if(sh.length>=6){const hs=sh.map(l=>l.sleepH).sort((a,b)=>a-b),md=hs[Math.floor(hs.length/2)],lg=sh.filter(l=>l.sleepH>=md).map(l=>l.energy),sr=sh.filter(l=>l.sleepH<md).map(l=>l.energy);if(lg.length>=3&&sr.length>=3){const d=avg(lg)-avg(sr);G.push(Math.abs(d)<0.3?'수면 시간이 긴 날과 짧은 날의 에너지 점수 차이는 크지 않았습니다.':`수면 시간이 긴 날(${md}시간 이상)의 평균 에너지 점수가 ${d>0?'더 높았습니다':'더 낮았습니다'} (${f1(avg(lg))} vs ${f1(avg(sr))}).`)}}else U.push('수면 시간과 에너지의 관계는 기록이 부족해서 판단하기 어렵습니다.');
 const top=list.filter(l=>l.mood>=4),low=list.filter(l=>l.mood<=2);
 if(top.length>=3){const c=Object.keys(SN).filter(k=>top.filter(l=>l[k]===true).length/top.length>=.67);if(c.length)F.push(`기분이 높았던 날(${top.length}일)에는 ${c.map(k=>'‘'+SN[k]+'’').join(', ')} 기록이 자주 있었습니다.`)}
 if(low.length>=3){const c=Object.keys(SN).filter(k=>low.filter(l=>l[k]===false).length/low.length>=.67);if(c.length)F.push(`기분이 낮았던 날(${low.length}일)에는 ${c.map(k=>'‘'+SN[k]+'’').join(', ')} 기록이 ‘아니요’인 경우가 많았습니다.`)}
 const fr=Object.keys(SN).map(k=>[k,list.filter(l=>l[k]===true).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,2);
 if(fr.length)F.push(`가장 자주 기록된 행동: ${fr.map(x=>SN[x[0]]+' '+x[1]+'일').join(', ')}.`);
 return {F,G,U,SG,nF}}
const NG={out:'외출하지 않은',talk:'사람과 대화하지 않은',move:'몸을 움직이지 않은',focus:'집중한 활동이 없던',self:'나를 위해 한 일이 없던',meal:'식사가 불규칙한'};
const tend=(L,v)=>Object.keys(LB).map(k=>{const a=L.filter(l=>typeof l[k]==='boolean');if(a.length<3)return null;const y=a.filter(l=>l[k]).length,m=v?y:a.length-y;return m/a.length>=.6?`${(v?LB:NG)[k]} 날이 많았어요 (${m}/${a.length}일)`:null}).filter(Boolean);
function dayBlock(L,txt,key,v){if(L.length<3)return `<p class="mut">기분 점수가 ${txt}인 날이 3일보다 적어서 공통점을 판단하기 어렵습니다 (${L.length}일).</p>`;const c=tend(L,v),memos=L.map(l=>l[key]).filter(Boolean).slice(0,3);return `<p class="mut">기분 점수 ${txt} · ${L.length}일</p>`+ul(c.length?c:['뚜렷한 공통점은 아직 보이지 않아요.'])+(memos.length?'<p class="mut">그날 내가 적어둔 말</p>'+ul(memos.map(t=>'“'+t.slice(0,80)+'”')):'')}
